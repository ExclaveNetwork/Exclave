name: TestExclaveD Build
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APKs to the TestExclaveD release channel
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark this build as a pre-release
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    name: Build TestExclaveD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify test flavor is available
        run: |
          if ! grep -Fq 'productFlavors.create("clone")' buildSrc/src/main/kotlin/Helpers.kt; then
            echo "::error::This branch does not contain the current TestExclaveD clone flavor yet. Sync the main source before running this workflow."
            exit 1
          fi
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache-dependency-path: library/core/go.sum
      - name: Setup Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Build native core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./run lib core
      - name: Configure test signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing Actions secret: RELEASE_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Build signed test APKs
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          test -n "$KEYSTORE_PASS" || { echo "Missing Actions secret: KEYSTORE_PASS"; exit 1; }
          test -n "$ALIAS_NAME" || { echo "Missing Actions secret: ALIAS_NAME"; exit 1; }
          test -n "$ALIAS_PASS" || { echo "Missing Actions secret: ALIAS_PASS"; exit 1; }
          ./gradlew :app:updateAssets :app:assembleCloneRelease
      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: TestExclaveD-APKs
          path: app/build/outputs/apk/clone/release/*.apk
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish test pre-release
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download test APKs
        uses: actions/download-artifact@v8
        with:
          name: TestExclaveD-APKs
          path: artifacts
      - name: Publish GitHub pre-release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          tag="test-v${version}-${GITHUB_RUN_NUMBER}"
          mkdir -p apks
          find artifacts -type f -name '*.apk' -exec cp {} apks/ \;
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "TestExclaveD ${version} (build ${GITHUB_RUN_NUMBER})" --notes "Automated TestExclaveD build." --prerelease apks/*.apk
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "TestExclaveD ${version}" --notes "TestExclaveD release." apks/*.apk
          fi
